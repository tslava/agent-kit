name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Lint plugins and skills
        run: uv run --no-project --python 3.14 python scripts/lint_skills.py
      - name: Validate plugin manifests
        run: |
          for f in .claude-plugin/marketplace.json plugins/*/.claude-plugin/plugin.json; do
            python3 -m json.tool "$f" > /dev/null
          done
      - name: Test bundled scripts
        run: uv run --no-project --python 3.14 --with pytest pytest -q tests

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
